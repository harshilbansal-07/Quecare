<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff login - QueCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Instrument+Sans:wght@400..600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand-link" href="/"><span class="wordmark">QueCare</span><span class="tagline">Staff login</span></a>
  </header>
  <main>
    <div class="panel login-box">
      <h2>Staff login</h2>
      <p class="hint">For reception and doctors. Patients do not need to log in.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
        <button type="submit">Log in</button>
      </form>
      <div id="msg" class="msg" role="status"></div>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/login.js"></script>
</body>
</html>
