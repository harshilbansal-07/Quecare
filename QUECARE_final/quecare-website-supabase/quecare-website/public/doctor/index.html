<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor - QueCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Instrument+Sans:wght@400..600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand-link" href="/"><span class="wordmark">QueCare</span><span class="tagline">Doctor</span></a>
    <span class="who"><span id="who">Doctor</span><button id="logout" class="light small" type="button">Log out</button></span>
  </header>
  <main>
    <div id="msg" class="msg" role="status"></div>

    <section class="panel" aria-labelledby="queue-title">
      <h2 id="queue-title">My queue</h2>
      <p id="capacity" class="count"></p>
      <p class="hint">Call the next patient, then mark the visit complete. Patients flagged as not arrived are handled by reception. This list refreshes every 10 seconds.</p>
      <div class="table-wrap">
        <table class="stack">
          <thead><tr><th>Position</th><th>Token</th><th>Patient</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>No patients in your queue.</p>
    </section>
  </main>
  <script src="/js/common.js"></script>
  <script src="doctor.js"></script>
</body>
</html>
